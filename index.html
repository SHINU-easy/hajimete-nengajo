<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>はじめての年賀状</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&family=Yuji+Syuku&family=Noto+Sans:wght@400;600&family=Noto+Sans+SC:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Myanmar:wght@400;600&display=swap">
<style>
/* Layout: sticky header + tab bar, one column of "paper" sections; the write tab is a two-pane studio (form | live postcard). */
:root{
  --bg:#ECEFEA;          /* 白鼠 with a pine bias */
  --surface:#FFFFFF;
  --surface-2:#F5F7F3;
  --ink:#1D2320;
  --muted:#59635E;
  --line:#D3D9D2;
  --shu:#C3352A;         /* 朱 vermilion */
  --shu-soft:#F8E2DE;
  --pine:#2C6651;        /* 松葉 pine */
  --pine-soft:#DDEBE4;
  --gold:#9C7A2C;
  --p1:#2C78B8; --p1bg:#DCEAF6;   /* 前文 blue (textbook color code) */
  --p2:#A27B00; --p2bg:#FFF2BF;   /* 主文 yellow */
  --p3:#C34A6E; --p3bg:#FADDE6;   /* 末文 pink */
  --p4:#2F8A4F; --p4bg:#DAEEDF;   /* 後付け green */
  --f-ui:"BIZ UDPGothic","Noto Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-card:"Klee One","UD Digi Kyokasho N-R","Yu Kyokasho","YuKyokasho","Hiragino Mincho ProN",serif;
  --f-disp:"Yuji Syuku","Klee One","Yu Mincho","Hiragino Mincho ProN",serif;
  --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614;--surface:#1B201E;--surface-2:#222825;--ink:#E9ECE8;--muted:#A3ACA7;--line:#343C38;
  --shu:#F0705F;--shu-soft:#3A2220;--pine:#78C3A3;--pine-soft:#1E3129;--gold:#D6B66A;
  --p1:#7DB6EA;--p1bg:#1C2B3A;--p2:#E6C55A;--p2bg:#332C12;--p3:#EE8FAA;--p3bg:#3A1F28;--p4:#7ED19A;--p4bg:#1C3324;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614;--surface:#1B201E;--surface-2:#222825;--ink:#E9ECE8;--muted:#A3ACA7;--line:#343C38;
  --shu:#F0705F;--shu-soft:#3A2220;--pine:#78C3A3;--pine-soft:#1E3129;--gold:#D6B66A;
  --p1:#7DB6EA;--p1bg:#1C2B3A;--p2:#E6C55A;--p2bg:#332C12;--p3:#EE8FAA;--p3bg:#3A1F28;--p4:#7ED19A;--p4bg:#1C3324;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
ruby{ruby-align:center}
html{font-size:16px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);line-height:1.7;margin:0}
body.big{font-size:1.32rem}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
:lang(zh),.tr[lang="zh"]{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",var(--f-ui)}
.tr[lang="vi"],.tr[lang="en"]{font-family:"Noto Sans","Segoe UI",Arial,var(--f-ui)}
.tr[lang="ne"]{font-family:"Noto Sans Devanagari","Nirmala UI","Mangal",var(--f-ui)}
.tr[lang="my"]{font-family:"Noto Sans Myanmar","Myanmar Text","Myanmar Sangam MN","Padauk",var(--f-ui);line-height:2}
ruby rt{font-size:.52em;color:var(--muted);font-weight:400}
body.no-furi .ja rt{display:none}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--shu);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.seal{flex:none;width:42px;height:42px;border-radius:6px;background:var(--shu);color:#fff;display:grid;place-items:center;font-family:var(--f-disp);font-size:1.25rem;line-height:1;writing-mode:vertical-rl;letter-spacing:.05em}
.brand h1{margin:0;font-family:var(--f-disp);font-weight:400;font-size:1.55rem;line-height:1.2;letter-spacing:.04em}
.brand small{display:block;font-family:var(--f-ui);font-size:.72rem;color:var(--muted);letter-spacing:.02em}
.controls{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.ctl select{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--ink)}
.toggle{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.85rem}
.toggle[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
.langs{flex-wrap:wrap}
.langbtns{display:flex;flex-wrap:wrap;gap:4px}
.langbtns .toggle{padding:4px 10px;color:var(--ink);display:inline-flex;flex-direction:column;align-items:center;line-height:1.25}
.langbtns .nat{font-size:.68rem;opacity:.8;white-space:nowrap}
.langbtns .nat[lang="ne"]{font-family:"Noto Sans Devanagari","Nirmala UI","Mangal",var(--f-ui)}
.langbtns .nat[lang="my"]{font-family:"Myanmar Text","Myanmar Sangam MN","Noto Sans Myanmar","Padauk",var(--f-ui);line-height:normal;font-size:.66rem}
.langbtns .nat[lang="zh"]{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",var(--f-ui)}
.langbtns .nat[lang="vi"],.langbtns .nat[lang="en"]{font-family:"Noto Sans","Segoe UI",Arial,var(--f-ui)}
.ctl-toggle{display:none;align-items:center;gap:6px;margin-left:auto;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 10px 5px 8px;cursor:pointer;font-size:.85rem;color:var(--ink);max-width:100%}
.ctl-toggle svg{width:18px;height:18px;flex:none}
.ctl-toggle .ct-sum{color:var(--pine);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:9em}
.ctl-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
.langbtns .toggle[aria-pressed="true"]{color:#fff}
.langbtns .toggle.only{border-style:dashed}
.tr + .tr{margin-top:0}
nav.tabs button .tr + .tr{display:none} /* タブ見出しの訳は、画面の幅にかかわらず最初の1言語だけ（2026-11-26） */
body.multi .tr[data-l]::before{content:attr(data-l);display:inline-block;min-width:2.2em;margin-right:.45em;padding:0 .3em;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);font-size:.72em;font-family:var(--f-ui);text-align:center;vertical-align:.1em;color:var(--muted)}
body.multi nav.tabs .tr::before,body.multi .btn .tr::before,body.multi .choice label .tr::before{display:none}
.hide-head,.show-head{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:4px 10px 4px 6px;cursor:pointer;font-size:.82rem;line-height:1.15}
.hide-head svg,.show-head svg{width:18px;height:18px;flex:none}
.hide-head span,.show-head span{display:flex;flex-direction:column;align-items:flex-start}
.hide-head small,.show-head small{font-size:.66rem;color:var(--muted)}
.top-inner{position:relative}
.hide-head{position:absolute;top:16px;right:max(16px,env(safe-area-inset-right,0px))}
.controls{margin-right:92px}
.show-head{position:fixed;z-index:40;top:calc(env(safe-area-inset-top,0px) + 8px);right:max(12px,calc(env(safe-area-inset-right,0px) + 8px));box-shadow:0 2px 10px rgba(0,0,0,.18);background:var(--surface)}
body.head-hidden .top{display:none}
body.head-hidden::before{background:var(--bg)}
body.head-hidden .preview-col{top:calc(env(safe-area-inset-top,0px) + 56px)}
body.head-hidden #yearCard{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 56px)}
nav.tabs{flex-basis:100%;display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;margin-top:4px}
nav.tabs button{flex:none;border:0;background:none;padding:8px 14px 10px;border-bottom:3px solid transparent;cursor:pointer;color:var(--muted);line-height:1.25;text-align:center}
nav.tabs button .ja{display:block;font-weight:700;font-size:1rem}
nav.tabs button .tr{display:block;font-size:.7rem}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--shu)}

main{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 40px}
.panel[hidden]{display:none}
.lead{display:flex;flex-direction:column;gap:2px;margin:0 0 18px}
.lead h2{margin:0;font-size:1.45rem;line-height:1.5;text-wrap:balance}
.banner{display:flex;gap:12px;align-items:flex-start;margin:0 0 16px;padding:12px 14px;border:1.5px solid var(--shu);border-radius:var(--radius);background:var(--shu-soft);max-width:860px}
.banner p{margin:0 0 4px}
.bmark{flex:none;background:var(--shu);color:#fff;border-radius:6px;padding:2px 8px;font-size:.8rem;line-height:1.6}
.alert-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--shu);margin-left:4px;vertical-align:super}
#yearCard{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 150px)}
#yearCard.flash{outline:3px solid var(--shu);outline-offset:3px}
.yearchip{align-self:flex-start;font-size:.85rem;color:var(--shu);border:1px solid var(--shu);border-radius:999px;padding:1px 12px;margin-bottom:6px}
.lead h2 .tr{display:block;font-size:.85rem;font-weight:400;color:var(--muted)}
.tr{display:block;color:var(--muted);font-size:.86em;line-height:1.6;margin-top:2px}
.inline-tr .tr{display:inline;margin-left:.5em}

.grid{display:grid;gap:14px}
.grid.cols{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;min-width:0}
.card h3{margin:0 0 6px;font-size:1.1rem;line-height:1.5;display:flex;gap:10px;align-items:baseline}
.card h3 .num{flex:none;font-family:var(--f-disp);color:var(--shu);font-size:1.25rem;font-weight:400}
.card h3 .tr{font-weight:400}
.card p{margin:0}
.card.wide{grid-column:1/-1}
.flow{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;counter-reset:none}
.flow li{position:relative;display:flex;gap:8px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0}
.flow li b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--shu);color:#fff;display:grid;place-items:center;font-family:var(--f-disp);font-weight:400}
.flow li > span{min-width:0}
.flow li:last-child{border-color:var(--shu);background:var(--shu-soft)}
.eto-ring{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;margin-top:12px}
.eto{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 4px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);line-height:1.3}
.eto b{font-family:var(--f-card);font-size:1.35rem;font-weight:600}
.eto small{font-size:.72rem;color:var(--muted)}
.eto .eto-tr{display:block;text-align:center;font-size:.68rem;line-height:1.3;color:var(--muted);overflow-wrap:anywhere;margin-top:1px}
.eto .eto-tr[lang="zh"]{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",var(--f-ui)}
.eto .eto-tr[lang="vi"],.eto .eto-tr[lang="en"]{font-family:"Noto Sans","Segoe UI",Arial,var(--f-ui)}
.eto .eto-tr[lang="ne"]{font-family:"Noto Sans Devanagari","Nirmala UI","Mangal",var(--f-ui)}
.eto .eto-tr[lang="my"]{font-family:"Myanmar Text","Myanmar Sangam MN","Noto Sans Myanmar","Padauk",var(--f-ui);line-height:normal}
.eto.on .eto-tr{color:var(--ink)}
.eto.on{border-color:var(--shu);background:var(--shu-soft)}
.eto.on b{color:var(--shu)}
.born{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);display:grid;gap:6px}
.born label{font-weight:700}
.born-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.born input{width:8em;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface);font-size:1.1rem}
#bornOut{font-size:1.15rem;font-weight:700;min-width:0}
#bornOut .tr{font-weight:400;font-size:.8em}
.born .hint{margin:0;font-size:.8rem;color:var(--muted)}
.eto-world{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.eto-world summary{cursor:pointer;font-weight:700;list-style-position:outside}
.eto-world summary .tr{font-weight:400}
.eto-world ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
.eto-world li{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.eto-world li p{margin:0 0 6px}
.eto-world .eto-ask{margin:10px 0 0;font-weight:700}
.mode-switch{display:flex;flex-wrap:wrap;gap:8px}
.easy-fixed{font-family:var(--f-card);font-size:1.2rem;padding:8px 12px;background:var(--surface-2);border-radius:8px}
.guides{position:absolute;inset:0;pointer-events:none}
.guides i{position:absolute;width:0;height:0}
.guides.v i{border-left:.25mm dashed #7FA9CF}
.guides.h i{border-top:.25mm dashed #7FA9CF}
.mode-trace .card-text{z-index:1}
.a-to-name .nc{display:flex;justify-content:space-between;align-items:center;inline-size:100%}
.fact{margin-top:10px;padding:8px 10px;background:var(--surface-2);border-radius:8px;font-size:.88rem}
.fact b{color:var(--shu)}
.src{font-size:.75rem;color:var(--muted);margin-top:8px}

/* words */
.gashi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.gashi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.gashi .big{font-family:var(--f-card);font-size:1.7rem;line-height:1.5;font-weight:600}
.gashi .big rt{font-family:var(--f-ui)}
.tag{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:999px;border:1px solid currentColor;line-height:1.6;white-space:nowrap}
.tag.up{color:var(--pine)}
.tag.peer{color:var(--gold)}
.tag.ex{color:var(--shu)}
.say{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.85rem}
.say svg{width:18px;height:18px}
.say:hover{border-color:var(--pine)}
.say-mini{display:inline-flex;align-items:center;justify-content:center;vertical-align:-.25em;margin-left:.4em;width:1.9em;height:1.6em;padding:0;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;cursor:pointer}
.say-mini svg{width:1.05em;height:1.05em}
.say-mini:hover{color:var(--pine);border-color:var(--pine)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;max-width:min(92vw,520px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.92rem;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast .tr{color:var(--bg);opacity:.8}
#toast rt{color:var(--bg)}
.vtable td.ok{color:var(--pine);font-weight:700}
.vtable td.no{color:var(--shu);font-weight:700}
.ng{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.ng .card{border-left:0;position:relative;padding-left:52px}
.ng .mark{position:absolute;left:14px;top:14px;width:26px;height:26px;border-radius:50%;background:var(--shu);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.9rem}
.phr{display:grid;gap:8px}
.phr-row{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.phr-row .txt{flex:1;min-width:0;font-family:var(--f-card);font-size:1.12rem}
.phr-row .txt .tr{font-family:var(--f-ui)}
h3.sec{margin:26px 0 10px;font-size:1.15rem}
h3.sec .tr{display:inline;margin-left:.6em;font-weight:400}

/* parts */
.parts-wrap{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:22px;align-items:start}
.part-list{display:grid;gap:10px}
.part{border-radius:var(--radius);padding:12px 14px;border:2px solid transparent;cursor:pointer;background:var(--surface)}
.part h4{margin:0 0 4px;font-size:1.05rem;display:flex;gap:8px;align-items:center}
.part .dot{width:24px;height:24px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:.85rem;flex:none}
.part.k1{border-color:var(--p1)} .part.k1 .dot{background:var(--p1)}
.part.k2{border-color:var(--p2)} .part.k2 .dot{background:var(--p2)}
.part.k3{border-color:var(--p3)} .part.k3 .dot{background:var(--p3)}
.part.k4{border-color:var(--p4)} .part.k4 .dot{background:var(--p4)}
.part.on.k1{background:var(--p1bg)} .part.on.k2{background:var(--p2bg)} .part.on.k3{background:var(--p3bg)} .part.on.k4{background:var(--p4bg)}

/* hagaki (fixed paper colors in both themes: it is a physical postcard) */
.hagaki{position:relative;width:100%;aspect-ratio:100/148;background:#FFFFFF;color:#1A1A1A;container-type:size;overflow:hidden;font-family:var(--f-card);border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.12),0 8px 24px rgba(30,40,35,.14)}
.card-text{position:absolute;top:7cqh;bottom:7cqh;left:9cqw;right:9cqw;writing-mode:vertical-rl;font-size:calc(var(--fs,5) * 1cqw);line-height:1.8;overflow:hidden}
.has-pic .card-text{bottom:31cqh}
.yoko .card-text{writing-mode:horizontal-tb;line-height:1.75}
.card-text p{margin:0}
.c-gashi{font-weight:600;margin-block-end:.5em!important;letter-spacing:.06em;white-space:nowrap}
.c-body{margin-block-end:.25em}
.c-close{margin-block-end:.2em!important}
.c-sign{display:flex;justify-content:space-between;gap:1.2em;padding-inline-start:1.6em}
.c-name{font-weight:600}
.c-pic{position:absolute;left:9cqw;right:9cqw;bottom:5cqh;height:24cqh;display:flex;align-items:center;justify-content:center}
.c-pic svg,.c-pic img{max-width:100%;max-height:100%;height:100%}
.mode-trace .card-text{color:#BDBDBD;font-weight:400}
.mode-trace .c-gashi,.mode-trace .c-name{font-weight:400}
.mode-trace .c-pic{opacity:.28;filter:grayscale(1)}
.hagaki rt{font-family:var(--f-ui);font-size:.45em;color:#666}
.blank{color:#C3352A;border-bottom:1px dashed #C3352A}
.yoko .blank{border-bottom:1px dashed}
.parts-on .seg{border-radius:4px;transition:background .15s}
.parts-on .s1{background:#DCEAF6}.parts-on .s2{background:#FFF2BF}.parts-on .s3{background:#FADDE6}.parts-on .s4{background:#DAEEDF}
.parts-on.focus-1 .seg:not(.s1),.parts-on.focus-2 .seg:not(.s2),.parts-on.focus-3 .seg:not(.s3),.parts-on.focus-4 .seg:not(.s4){opacity:.3}

/* write studio */
.studio{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,380px);gap:24px;align-items:start}
.steps{display:grid;gap:14px;min-width:0}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;min-width:0}
.step > h3{margin:0 0 10px;font-size:1.05rem;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.step > h3 .n{font-family:var(--f-disp);color:var(--shu);font-weight:400;font-size:1.3rem;line-height:1}
.step > h3 .tr{display:inline;font-weight:400;font-size:.8rem}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{position:relative}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice label{display:flex;flex-direction:column;gap:2px;border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;background:var(--surface-2);line-height:1.5;min-width:0}
.choice label .tr{font-size:.75rem;margin:0}
.choice input:checked + label{border-color:var(--shu);background:var(--shu-soft)}
.choice input:focus-visible + label{outline:3px solid var(--shu);outline-offset:2px}
.choices.list{flex-direction:column}
.choices.list .choice label{flex-direction:row;align-items:flex-start;gap:10px;font-family:var(--f-card);font-size:1.05rem}
.choices.list .choice label > span{min-width:0}
.choices.list .choice label .tr{font-family:var(--f-ui);display:block}
.choices.list .tagcol{margin-left:auto;flex:none}
.fill{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 4px 4px}
.fill input{border:1.5px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0;width:12em;background:var(--surface);font-family:var(--f-card);font-size:1.05rem}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;cursor:pointer;font-size:.88rem}
.chip:hover{border-color:var(--pine)}
.warn{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--shu-soft);color:var(--ink);font-size:.88rem}
.field{display:grid;gap:4px;margin-top:6px}
.field > span{font-size:.88rem;font-weight:700}
.field input[type=text],.field textarea{border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);width:100%;min-width:0}
.field textarea{min-height:4.5em;resize:vertical;font-family:var(--f-card);font-size:1.05rem}
.field .hint{font-size:.78rem;color:var(--muted)}
.preview-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + 132px);display:grid;gap:12px}
.preview-col .hagaki{max-width:380px;margin:0 auto}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;line-height:1.35;text-align:left}
.btn .tr{font-size:.72rem;margin:0}
.btn.primary{background:var(--shu);border-color:var(--shu);color:#fff}
.btn.primary .tr{color:#fff;opacity:.85}
.btn svg{width:18px;height:18px;flex:none}
.note{font-size:.78rem;color:var(--muted);text-align:center}
.example-flag{display:flex;gap:8px;align-items:center;justify-content:center;font-size:.8rem;color:var(--shu)}
.draw-wrap{display:grid;gap:8px;margin-top:10px}
#drawPad{width:100%;max-width:420px;aspect-ratio:5/3;background:#fff;border:1.5px dashed var(--line);border-radius:8px;touch-action:none;cursor:crosshair}
.pens{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pen{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
.pen[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.pic-choices .choice label{align-items:center;padding:6px 10px;width:96px}
.pic-choices svg{width:64px;height:40px}

/* address */
.addr-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,380px);gap:24px;align-items:start}
.addr-form{display:grid;gap:14px;min-width:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 12px}
.check{display:flex;gap:8px;align-items:flex-start;margin-top:8px;font-size:.92rem}
.check input{margin-top:.35em;width:18px;height:18px;flex:none}
.tips{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.tips li{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.tips li b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--pine);color:#fff;display:grid;place-items:center;font-size:.8rem}
.tips li > span{min-width:0}
.hagaki.addr{font-family:var(--f-card)}
.a-stamp{position:absolute;left:6cqw;top:4cqh;width:20cqw;height:15.5cqh;border:.5cqw dashed #9AA39E;color:#9AA39E;display:grid;place-items:center;font-family:var(--f-ui);font-size:3.2cqw}
.a-nenga{position:absolute;left:6cqw;top:21cqh;width:20cqw;text-align:center;color:#D0261C;font-size:6cqw;font-weight:600;letter-spacing:.1em}
.zipbox{position:absolute;display:flex;align-items:stretch}
.zipbox i{font-style:normal;display:grid;place-items:center;border:.35cqw solid #D0261C;color:#1A1A1A;font-family:var(--f-card);font-weight:600;position:absolute;top:0}
.zip-to{top:8.1cqh;left:0;width:100%;height:5.4cqh}
.zip-to i{width:5.7cqw;height:100%;font-size:5cqw}
.zip-from{bottom:3.5cqh;left:0;width:100%;height:3.6cqh}
.zip-from i{width:4cqw;height:100%;font-size:3.2cqw;border-width:.25cqw}
.zip-to b,.zip-from b{position:absolute;top:50%;height:.35cqw;background:#D0261C}
.a-to-addr{position:absolute;right:7cqw;top:19cqh;height:62cqh;writing-mode:vertical-rl;font-size:5cqw;line-height:1.55;text-orientation:upright;white-space:pre-wrap}
.a-to-addr .l2{padding-inline-start:3em}
.a-to-addr .l3{padding-inline-start:4.5em;font-size:.9em}
.a-to-name{position:absolute;top:19cqh;height:67cqh;left:50%;transform:translateX(-50%);writing-mode:vertical-rl;font-weight:600;text-orientation:upright;white-space:nowrap;line-height:1.35}
.a-from{position:absolute;left:7cqw;bottom:11cqh;height:46cqh;writing-mode:vertical-rl;font-size:3.4cqw;line-height:1.5;text-orientation:upright}
.a-from .fa2{padding-inline-start:2em}
.a-from .fn{font-size:1.35em;font-weight:600;text-align:end;margin-block-start:.3em;letter-spacing:.15em}
.a-yoko{position:absolute;inset:0}
.real-mode .a-stamp,.real-mode .zipbox{display:none}

/* quiz */
.quiz{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.q h3{font-size:1.05rem}
.opts{display:grid;gap:6px;margin-top:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 12px;cursor:pointer;font-family:var(--f-card);font-size:1.05rem}
.opt.right{border-color:var(--pine);background:var(--pine-soft)}
.opt.wrong{border-color:var(--shu);background:var(--shu-soft)}
.exp{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:.92rem}
.exp .ok{font-weight:700;color:var(--pine)}
.exp .ng2{font-weight:700;color:var(--shu)}
.score{display:flex;gap:12px;align-items:center;margin-bottom:14px;font-size:1rem}
.score strong{font-family:var(--f-disp);font-size:1.6rem;font-weight:400;color:var(--shu);font-variant-numeric:tabular-nums}

/* teacher */
.tdoc{max-width:860px;display:grid;gap:14px}
.tdoc .card h3{font-size:1.08rem}
.tdoc ul,.tdoc ol{margin:6px 0 0;padding-left:1.3em}
.tdoc li{margin:3px 0}
.tdoc table{border-collapse:collapse;width:100%;font-size:.9rem}
.tdoc th,.tdoc td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tdoc th{background:var(--surface-2);white-space:nowrap}
.tbl{overflow-x:auto}
.tdoc a{color:var(--pine)}
blockquote{margin:6px 0;padding:6px 12px;border-left:3px solid var(--line);color:var(--muted);font-size:.88rem}

/* confirm bar */
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:10px;border:1.5px solid var(--shu);border-radius:8px;background:var(--shu-soft);font-size:.9rem}

@media (max-width:400px){ .top .brand h1{font-size:1.06rem} .top .brand{gap:8px} .top .top-inner{column-gap:10px} }
footer{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 30px;color:var(--muted);font-size:.78rem}

/* 中くらいの横長画面（電子黒板・タブレット横向き）：言語ボタンの列を1行に収める（2026-11-26） */
@media (min-width:721px) and (max-width:1099px){
  .controls{gap:5px;margin-right:0;margin-left:0} /* この幅ではロゴの下の行に来るので「かくす」と重ならない */
  .ctl{gap:4px;font-size:.76rem}
  .toggle{padding:4px 9px;font-size:.78rem}
  .langbtns{gap:3px}
  .langbtns .toggle{padding:3px 7px}
  .langbtns .nat{font-size:.6rem}
  .langbtns .nat[lang="my"]{font-size:.58rem}
}
@media (min-width:721px) and (max-width:899px){
  .controls{gap:4px}
  .ctl{font-size:.7rem}
  .toggle{padding:3px 6px;font-size:.74rem}
  .langbtns{gap:2px}
  .langbtns .toggle{padding:3px 5px}
}
@media (max-width:860px){
  .studio,.addr-wrap,.parts-wrap{grid-template-columns:1fr}
  .preview-col{position:static}
  .preview-col .hagaki{max-width:340px}
}
@media (max-width:720px){
  .brand{flex:0 0 auto}
  .brand h1{white-space:nowrap}
  .ctl-toggle{margin-left:auto}
  .brand small{display:none}
  .ctl-toggle{display:inline-flex}
  .hide-head small{display:none}
  .hide-head{top:15px}
  .ctl-toggle{margin-right:84px}
  .controls{margin-right:0}
  .controls{display:none;flex-basis:100%;margin-left:0;padding-bottom:6px}
  .top.open .controls{display:flex}
  nav.tabs button .tr + .tr{display:none}
}
@media (max-width:520px){
  .seal{width:34px;height:34px;font-size:.88rem;letter-spacing:0}
  .hide-head{top:12px;padding:5px}
  .hide-head span{display:none}
  .ctl-toggle{margin-right:42px}
  .ctl-toggle .ct-lab{display:none}
  .brand h1{font-size:1.25rem}
  .controls{margin-left:0}
}

/* print */
#printArea{position:fixed;left:-20000px;top:0;visibility:hidden;width:100mm}
#printArea .hagaki{width:100mm;height:148mm;aspect-ratio:auto;box-shadow:none;border-radius:0}
#printArea.framed{width:210mm}
#printArea.framed .hagaki{margin:30mm auto 0;outline:.3mm dashed #666;outline-offset:0}
#printArea .cut-note{margin:4mm 0 0;text-align:center;font:3.2mm/1.4 "BIZ UDPGothic","Yu Gothic",sans-serif;color:#666}
.frame-opt{justify-content:center;font-size:.85rem;margin-top:4px}
.frame-note{margin:0}
@media print{
  body{background:#fff}
  body::before{display:none}
  body > *:not(#printArea){display:none!important}
  #printArea{position:static;visibility:visible;left:auto}
  .hagaki{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

<header class="top" id="topBar">
  <div class="top-inner">

    <button type="button" class="ctl-toggle" id="ctlToggle" aria-label="言語・表示 / Language" aria-expanded="false" aria-controls="controls"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span class="ct-lab">言語・表示</span><span class="ct-sum" id="ctlSum"></span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button type="button" class="hide-head" id="hideHead" aria-controls="topBar" aria-label="ヘッダーをかくす / Hide header"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>かくす<small lang="en">Hide</small></span></button>

<script>
(function(){
"use strict";

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// furigana notation: {漢字|かんじ}
const RB = /\{([^|{}]+)\|([^{}]+)\}/g;
const rb = s => s.replace(RB, "<ruby>$1<rt>$2</rt></ruby>");
const plain = s => s.replace(RB, "$1");
const kana = s => s.replace(RB, "$2");
const X = (ja, en, zh, vi, ne, my) => ({ja, en, zh, vi, ne, my});
const BLANK = "＿＿";

const LANGS = [["ja","日本語だけ"],["en","英語"],["zh","中国語"],["vi","ベトナム語"],["ne","ネパール語"],["my","ミャンマー語"]];

/* ---------- state ---------- */
const KEY = "hajimete-nengajo-v1";
const SAMPLE_CARD = {partner:"teacher", gashi:"g1", thanks:"b1",
  news:[{id:"n3", fill:"ひらがなが読めること"},{id:"n1", fill:"漢字"}],
  free:"", memo:"", closing:"c1", date:"d1", name:"マイ", pic:"eto", dir:"tate", drawing:null, sample:true};
const SAMPLE_ADDR = {toZip:"1234567", toAddr1:"東京都みどり区さくら町1-2-3", toAddr2:"みどり夜間中学校", toAddr3:"", toName:"山田 花子", keisho:"先生",
  fromZip:"1234568", fromAddr1:"東京都みどり区もみじ町4-5-6", fromAddr2:"", fromName:"マイ", kanji:true, real:false, nenga:false, sample:true};
let state = {langs:["en"], yearOverride:null, furi:true, big:false, tab:"learn", card:clone(SAMPLE_CARD), addr:clone(SAMPLE_ADDR), quiz:{}};
function clone(o){return JSON.parse(JSON.stringify(o))}
try{ const s = JSON.parse(localStorage.getItem(KEY) || "null"); if(s && s.card){ state = Object.assign(state, s); if(!Array.isArray(s.langs)) state.langs = (s.lang && s.lang!=="ja") ? [s.lang] : (s.lang==="ja" ? [] : ["en"]); delete state.lang; } }catch(e){}
const LANG_ORDER = ["en","zh","vi","ne","my"];
if(state.card && state.card.pic === "sheep") state.card.pic = "eto";
const LCODE = {en:"EN",zh:"中",vi:"VI",ne:"NE",my:"MY"};
state.langs = LANG_ORDER.filter(l => (state.langs||[]).includes(l));
let saveTimer = null;
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }, 250); }

/* ---------- bilingual rendering ---------- */
function L(o, opts={}){
  const tag = opts.tag || "span";
  let h = `<span class="ja">${rb(o.ja)}</span>`;
  h += state.langs.filter(l=>o[l]).map(l=>`<${tag} class="tr" lang="${l}" data-l="${LCODE[l]}">${esc(o[l])}${opts.say?miniSay(o[l],l):""}</${tag}>`).join("");
  return h;
}
function TR(o, say){ return state.langs.filter(l=>o[l]).map(l=>`<span class="tr" lang="${l}" data-l="${LCODE[l]}">${esc(o[l])}${say?miniSay(o[l],l):""}</span>`).join(""); }
const LNAME = {ja:"日本語",en:"English",zh:"中文",vi:"Tiếng Việt",ne:"नेपाली",my:"မြန်မာ"};
function miniSay(text, l){ return `<button type="button" class="say-mini" data-say="${esc(text)}" data-sl="${l}" aria-label="${esc(LNAME[l])}: 音声 / audio">${ICON_SAY}</button>`; }

const ICON_SAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>';
const ICON_PRINT = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8V3h10v5M7 17H4v-7h16v7h-3M7 14h10v7H7z" stroke="currentColor" fill="none" stroke-width="2" stroke-linejoin="round"/></svg>';
function sayBtn(text, label){ return `<button class="say" data-say="${esc(text)}" type="button">${ICON_SAY}<span>${label||"きく"}</span></button>`; }

/* ---------- speech ---------- */
/* multilingual speech (Web Speech API; uses the voices installed on / offered by the device's browser) */
const VOICE_TAG = {ja:["ja-jp","ja"], en:["en-us","en-gb","en"], zh:["zh-cn","cmn-hans-cn","cmn-cn","zh-hans","cmn","zh"], vi:["vi-vn","vi"], ne:["ne-np","ne"], my:["my-mm","my"]};
const VOICE_BCP = {ja:"ja-JP", en:"en-US", zh:"zh-CN", vi:"vi-VN", ne:"ne-NP", my:"my-MM"};
const RATE = {ja:.85, en:.9, zh:.85, vi:.9, ne:.9, my:.9};
let voices = [];
function loadVoices(){ try{ voices = speechSynthesis.getVoices() || []; }catch(e){ voices = []; } if(typeof renderVoiceStatus==="function") renderVoiceStatus(); }
if("speechSynthesis" in window){ loadVoices(); try{ speechSynthesis.addEventListener("voiceschanged", loadVoices); }catch(e){ speechSynthesis.onvoiceschanged = loadVoices; } }
function findVoice(l){
  const norm = v => (v.lang||"").replace(/_/g,"-").toLowerCase();
  for(const tag of VOICE_TAG[l]||[]){
    const exact = voices.filter(v => norm(v) === tag || norm(v).startsWith(tag + "-"));
    if(exact.length){ return exact.find(v=>/natural|online|google/i.test(v.name)) || exact.find(v=>v.localService) || exact[0]; }
  }
  return null;
}
let toastTimer = null;
function toast(html){
  let t = document.getElementById("toast");
  if(!t){ t = document.createElement("div"); t.id = "toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.innerHTML = html; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.hidden = true; }, 5000);
}
function speak(text, l="ja"){
  if(!("speechSynthesis" in window)){ toast(`${rb("この ブラウザは {音声|おんせい}に {対応|たいおう}して いません。")}<span class="tr">This browser does not support speech.</span>`); return; }
  const v = findVoice(l);
  if(!v && voices.length){
    toast(`${rb(`この {端末|たんまつ}には「${LNAME[l]}」の {音声|おんせい}が ありません。`)}<span class="tr">No ${esc(LNAME[l])} voice on this device. (See 先生へ → 音声)</span>`);
    return;
  }
  try{
    speechSynthesis.cancel();
    for(const [sl, t] of speechParts(text, l)){
      const u = new SpeechSynthesisUtterance(t); u.lang = VOICE_BCP[sl];
      const sv = sl === l ? v : findVoice(sl); if(sv) u.voice = sv;
      u.rate = RATE[sl]||.9; speechSynthesis.speak(u);
    }
  }catch(e){}
}
// 読み上げ用の整形：①空欄（＿＿・___）は読まずに間をあける　②訳文の中の日本語は日本語の音声で読む
// 中国語の訳では、かなを含む語と、引用された日本語の語（JA_IN_ZH）だけを日本語として扱う（漢字だけの中国語は中国語のまま）
const JA_IN_ZH = new Set(["去年","昨年","旧年","元旦","元日","正月","新年","御中","様","先生様"]);
function speechParts(text, l){
  const pause = (l === "ja" || l === "zh") ? "、" : ", ";
  text = String(text).replace(/\s*[_＿]+\s*/g, pause).replace(/[✕×]/g, " ").replace(/(、\s*){2,}/g, "、");
  if(l === "ja") return [["ja", text]];
  const mark = new Array(text.length).fill(false);
  const run = /[\u3040-\u30ff\u3400-\u9fff\uf900-\ufaff々〆ー]+/g;
  let m;
  while((m = run.exec(text))){

    b:X(`${Y}{年|ねん}は「${e.a}（{${e.k}|${e.r}}）」の {年|とし}です。「{十二支|じゅうにし}」は、むかし {年|とし}や {時|じ}こく、{方角|ほうがく}を あらわすのに {使|つか}いました。おぼえやすいように、{身近|みぢか}な {動物|どうぶつ}を あてはめたと いわれています。{年賀状|ねんがじょう}には、その {年|とし}の {動物|どうぶつ}の {絵|え}を よく かきます。あなたの {国|くに}の {新年|しんねん}は いつですか？ どんな あいさつを しますか？ みんなに {教|おし}えて ください。`,
      `In Japan, ${Y} is the Year of the ${e.en} (${e.k}). The twelve zodiac signs (jūnishi) were once used to show years, times of day and directions; familiar animals are said to have been matched to them to make them easy to remember. People often draw that year's animal on their nengajō. When is New Year in your country? What greetings do people say? Please tell the class.`,
      `${Y}年是${e.k}年，生肖是${e.zh}。“十二支”过去用来表示年份、时辰和方位，据说为了便于记忆，配上了身边常见的动物。年贺状上常画当年的生肖动物。你的国家什么时候过新年？大家说什么祝福语？请告诉大家。`,

      `जापानमा सन् ${dev(Y)} “${e.ne}” को वर्ष हो। बाह्र राशि जनावर (जुनिसी) पहिले वर्ष, समय र दिशा जनाउन प्रयोग गरिन्थ्यो; सम्झन सजिलो होस् भनेर चिनजानका जनावरहरू जोडिएको भनिन्छ। नेन्गाजोमा प्रायः त्यस वर्षको जनावरको चित्र कोरिन्छ। तपाईंको देशमा नयाँ वर्ष कहिले हो? कस्तो शुभकामना भनिन्छ? कक्षामा सबैलाई सुनाउनुहोस्।`,
      `ဂျပန်တွင် ${mmr(Y)} ခုနှစ်သည် “${e.my}” နှစ် ဖြစ်သည်။ ၁၂ ရာသီတိရစ္ဆာန် (ဂျူးနိရှိ) ကို ရှေးက နှစ်၊ အချိန်နှင့် အရပ်မျက်နှာ ပြရန် သုံးခဲ့ပြီး မှတ်ရလွယ်အောင် ရင်းနှီးသော တိရစ္ဆာန်များကို တွဲထားသည်ဟု ဆိုကြသည်။ နင်ဂါဂျောတွင် ထိုနှစ်၏ တိရစ္ဆာန်ပုံကို မကြာခဏ ဆွဲကြသည်။ သင့်နိုင်ငံ၏ နှစ်သစ်ကူးသည် ဘယ်အချိန်လဲ။ ဘယ်လို နှုတ်ခွန်းဆက်ကြသလဲ။ အတန်းထဲက လူတွေကို ပြောပြပေးပါ။`)};

  );
  PARTS_SAMPLE.date = DATES[0].ja;

function missingBanner(){
  const Y = cardYear(); if(CONFIG.posts[Y]) return "";

  const timing = (m >= 2 && m <= 7)
    ? `日本郵便の発表は例年8〜9月ごろです（2027年用は2026年8月31日）。発表されたら登録してください。`
    : `すでに日本郵便から発表されている可能性があります。日本郵便のウェブサイト（ニュースリリース）で「${Y}年用年賀はがき」を確認してください。`;
  return `<div class="banner" role="status"><b class="bmark">要更新</b><div><p><b>${Y}年用の郵便の日程・料金が未登録です。</b>生徒の画面では一般的な案内（12月中旬から受付・12月25日ごろまでに出すと元日に届く・値段は郵便局で確認・寒中見舞いは2月3日ごろまで）を表示しています。</p><p>${timing}</p><button type="button" class="btn" id="toYearCard" style="margin-top:6px">「年の設定」の登録方法を見る</button></div></div>`;
}

// 干支の各マスの訳（選んだ言語ごと）。ベトナムは日本と動物が違う年（丑・卯・未）を併記、亥は日本では「いのしし」
function etoTr(e){
  const t = {
    en: e.en,
    zh: e.k === "亥" ? "猪（日本：野猪）" : e.zh,
    vi: e.vi + ": " + e.vJ + (e.vJ !== e.vV ? " (VN: " + e.vV + ")" : ""),
    ne: e.ne,
    my: e.my
  };
  return state.langs.map(l => `<small class="eto-tr" lang="${l}">${esc(t[l])}</small>`).join("");
}

    X(`{中国|ちゅうごく}：{亥|い}は「ぶた」です。{干支|えと}の {年|とし}は、{旧暦|きゅうれき}の お{正月|しょうがつ}（{春節|しゅんせつ}）から かわります。{春節|しゅんせつ}は {毎年|まいとし} {日|ひ}が ちがい、1{月|がつ}の おわりから 2{月|がつ}の あいだです。`,
      `China: 亥 is the pig. The zodiac year changes at the lunar New Year (Spring Festival), which falls on a different day each year, between late January and February.`,
      `中国：亥是“猪”。生肖年从农历新年（春节）开始更换。春节每年日期不同，在1月下旬到2月之间。`,
      `Trung Quốc: Hợi là con lợn. Năm con giáp đổi vào Tết âm lịch (Xuân Tiết). Ngày này mỗi năm một khác, rơi vào khoảng cuối tháng 1 đến tháng 2.`,
      `चीन: 亥 सुँगुर हो। राशि जनावरको वर्ष चन्द्र पात्रोको नयाँ वर्ष (वसन्त उत्सव) बाट फेरिन्छ। यो मिति हरेक वर्ष फरक हुन्छ, जनवरीको अन्त्यदेखि फेब्रुअरीसम्म पर्छ।`,
      `တရုတ်- 亥 သည် ဝက် ဖြစ်သည်။ တိရစ္ဆာန်နှစ်သည် လပြက္ခဒိန် နှစ်သစ်ကူး (နွေဦးပွဲတော်) တွင် ပြောင်းသည်။ ထိုနေ့သည် နှစ်စဉ် မတူဘဲ ဇန်နဝါရီလကုန်မှ ဖေဖော်ဝါရီလအတွင်း ကျသည်။`),
    X(`ベトナム：{丑|うし}は「すいぎゅう」、{卯|う}は「ねこ」、{未|ひつじ}は「やぎ」です。「{卯|う}」を ベトナム{語|ご}で「Mão」と {読|よ}み、「ねこ」を あらわす「mèo」と {音|おと}が にているからだと いわれています。{年|とし}は テト（{旧暦|きゅうれき}の お{正月|しょうがつ}）から かわります。`,
      `Vietnam: 丑 is the water buffalo, 卯 is the cat, and 未 is the goat. It is said that the cat came in because 卯, read "Mão" in Vietnamese, sounds like "mèo" (cat). The year changes at Tết (lunar New Year).`,
      `越南：丑是“水牛”，卯是“猫”，未是“山羊”。据说是因为“卯”在越南语中读作“Mão”，和“猫（mèo）”发音相近。生肖年从越南春节（Tết，农历新年）开始更换。`,
      `Việt Nam: Sửu là con trâu, Mão là con mèo, Mùi là con dê. Người ta cho rằng vì chữ 卯 đọc là “Mão”, gần giống âm “mèo”. Năm con giáp đổi vào Tết Nguyên Đán (Tết âm lịch).`,
      `भियतनाम: 丑 भैंसी, 卯 बिरालो र 未 बाख्रा हो। भियतनामी भाषामा 卯 लाई “माओ (Mão)” भनिन्छ, जुन बिरालो जनाउने “मेओ (mèo)” सँग मिल्दोजुल्दो सुनिन्छ भनिन्छ। वर्ष तेत (चन्द्र पात्रोको नयाँ वर्ष) बाट फेरिन्छ।`,
      `ဗီယက်နမ်- 丑 သည် ကျွဲ၊ 卯 သည် ကြောင်၊ 未 သည် ဆိတ် ဖြစ်သည်။ 卯 ကို ဗီယက်နမ်လို “Mão” ဟု ဖတ်ပြီး ကြောင်ကို ဆိုလိုသော “mèo” နှင့် အသံဆင်သောကြောင့်ဟု ဆိုကြသည်။ နှစ်သည် တက် (လပြက္ခဒိန် နှစ်သစ်ကူး) တွင် ပြောင်းသည်။`),
    X(`フィリピン：{中国系|ちゅうごくけい}の {人|ひと}たち（チノイ）の {文化|ぶんか}が {広|ひろ}まり、{春節|しゅんせつ}は {特別|とくべつ}な {休|やす}みの {日|ひ}に なっています。その {年|とし}の {干支|えと}の {占|うらな}い（{風水|ふうすい}）を {楽|たの}しむ {人|ひと}も {多|おお}いです。1{月|がつ}1{日|にち}の お{正月|しょうがつ}には、まるい くだものを 12こ ならべたり、{水玉|みずたま}もようの {服|ふく}を {着|き}たりします（まるい {形|かたち}は お{金|かね}を あらわします）。`,
      `Philippines: the culture of Chinese Filipinos (Tsinoys) has spread, and the Chinese New Year is a special non-working holiday. Many people enjoy reading the zodiac fortunes for the year (feng shui). At New Year on January 1, people set out 12 round fruits and wear polka dots (round shapes stand for money).`,
      `菲律宾：菲律宾华人（Tsinoy）的文化广为流传，春节已成为特别假日。很多人喜欢看当年的生肖运势（风水）。1月1日新年时，人们会摆上12种圆形水果，穿圆点花纹的衣服（圆形象征钱财）。`,
      `Philippines: văn hóa của người Philippines gốc Hoa (Tsinoy) được lan rộng, Tết Nguyên Đán là ngày nghỉ đặc biệt. Nhiều người thích xem vận hạn theo con giáp của năm (phong thủy). Vào năm mới ngày 1 tháng 1, người ta bày 12 loại quả tròn và mặc áo chấm bi (hình tròn tượng trưng cho tiền bạc).`,
      `फिलिपिन्स: चिनियाँ मूलका फिलिपिनो (चिनोय) हरूको संस्कृति फैलिएको छ, र चिनियाँ नयाँ वर्ष विशेष बिदा हो। धेरै मानिस त्यस वर्षको राशि जनावरको भाग्यफल (फेङ सुई) हेर्न रुचाउँछन्। जनवरी १ को नयाँ वर्षमा १२ वटा गोलो फलफूल राख्ने र थोप्ले बुट्टाको लुगा लगाउने चलन छ (गोलो आकारले पैसा जनाउँछ)।`,
      `ဖိလစ်ပိုင်- တရုတ်နွယ်ဖွား ဖိလစ်ပိုင်လူမျိုး (ချီနွိုင်) တို့၏ ယဉ်ကျေးမှု ပျံ့နှံ့လာပြီး တရုတ်နှစ်သစ်ကူးသည် အထူး ရုံးပိတ်ရက် ဖြစ်သည်။ ထိုနှစ်၏ တိရစ္ဆာန်နှစ် ဟောစာတမ်း (ဖုန်ရွှေ) ကို စိတ်ဝင်စားသူ များသည်။ ဇန်နဝါရီ ၁ ရက် နှစ်သစ်ကူးတွင် အလုံးဝိုင်း သစ်သီး ၁၂ မျိုးကို တင်ထားပြီး အစက်ပြောက်ပုံ အဝတ်ကို ဝတ်ကြသည် (အဝိုင်းပုံသည် ငွေကို ကိုယ်စားပြုသည်)။`),
    X(`ネパール：{民族|みんぞく}によって ちがいます。グルンの {人|ひと}たちの お{正月|しょうがつ}「タム・ロサル」では、わし・へび・うま・ひつじ・さる・とり・いぬ・しか・ねずみ・うし・とら・ねこ の 12です。タマンの {人|ひと}たちの「ソナム・ロサル」では、{中国|ちゅうごく}と ほぼ おなじ 12の {動物|どうぶつ}（ねずみ〜ぶた）を {使|つか}います。`,
      `Nepal: it differs by community. In Tamu Lhosar, the Gurung New Year, the 12 animals are eagle, snake, horse, sheep, monkey, bird, dog, deer, mouse, cow, tiger and cat. In Sonam Lhosar, the Tamang New Year, people use 12 animals almost the same as China's (rat to pig).`,
      `尼泊尔：不同民族各不相同。古隆族的新年“塔姆洛萨”使用鹰、蛇、马、羊、猴、鸟、狗、鹿、鼠、牛、虎、猫十二种动物。塔芒族的新年“索南洛萨”使用和中国几乎相同的十二种动物（从鼠到猪）。`,
      `Nepal: khác nhau tùy dân tộc. Trong Tamu Lhosar (Tết của người Gurung), 12 con vật là đại bàng, rắn, ngựa, cừu, khỉ, chim, chó, hươu, chuột, bò, hổ và mèo. Trong Sonam Lhosar (Tết của người Tamang), người ta dùng 12 con vật gần giống Trung Quốc (từ chuột đến lợn).`,
      `नेपाल: जातिअनुसार फरक हुन्छ। गुरुङहरूको नयाँ वर्ष “तमु ल्होसार” मा गरुड (चील), सर्प, घोडा, भेडा, बाँदर, चरा, कुकुर, मृग, मुसा, गाई, बाघ र बिरालो गरी १२ जनावर हुन्छन्। तामाङहरूको “सोनाम ल्होसार” मा चीनको जस्तै १२ जनावर (मुसादेखि सुँगुरसम्म) प्रयोग गरिन्छ।`,
      `နီပေါ- လူမျိုးအလိုက် မတူပါ။ ဂူရုန်လူမျိုး၏ နှစ်သစ် “တာမူ လိုဆာ” တွင် လင်းယုန်၊ မြွေ၊ မြင်း၊ သိုး၊ မျောက်၊ ငှက်၊ ခွေး၊ သမင်၊ ကြွက်၊ နွား၊ ကျား၊ ကြောင် ၁၂ ကောင် ဖြစ်သည်။ တာမန်လူမျိုး၏ “ဆိုနမ် လိုဆာ” တွင် တရုတ်နှင့် အတော်တူသော တိရစ္ဆာန် ၁၂ ကောင် (ကြွက်မှ ဝက်အထိ) ကို သုံးသည်။`),
    X(`ミャンマー：{生|う}まれた {年|とし}ではなく、{生|う}まれた {曜日|ようび}で {動物|どうぶつ}が きまります（8つ）。{日曜|にちよう}は ガルーダ（{伝説|でんせつ}の {鳥|とり}）、{月曜|げつよう}は とら、{火曜|かよう}は ライオン、{水曜|すいよう}の {午前|ごぜん}は きばの ある ぞう、{午後|ごご}は きばの ない ぞう、{木曜|もくよう}は ねずみ、{金曜|きんよう}は モルモット、{土曜|どよう}は ナーガ（りゅう）です。`,
      `Myanmar: the animal is decided not by the year but by the day of the week you were born (8 signs): Sunday garuda (a mythical bird), Monday tiger, Tuesday lion, Wednesday morning tusked elephant, Wednesday afternoon tuskless elephant, Thursday rat, Friday guinea pig, Saturday naga (dragon).`,
      `缅甸：不是看出生年份，而是看出生那天是星期几来决定动物（共8种）：星期日是迦楼罗（传说中的鸟），星期一是虎，星期二是狮子，星期三上午是有象牙的象，下午是没有象牙的象，星期四是鼠，星期五是豚鼠，星期六是那伽（龙）。`,
      `Myanmar: con vật không tính theo năm sinh mà theo thứ trong tuần bạn sinh ra (8 con): Chủ nhật là Garuda (chim thần), thứ Hai là hổ, thứ Ba là sư tử, sáng thứ Tư là voi có ngà, chiều thứ Tư là voi không ngà, thứ Năm là chuột, thứ Sáu là chuột lang, thứ Bảy là Naga (rồng).`,
      `म्यानमार: जन्मेको वर्षले होइन, जन्मेको बारले जनावर तय हुन्छ (८ वटा): आइतबार गरुड (पौराणिक चरा), सोमबार बाघ, मङ्गलबार सिंह, बुधबार बिहान दाँत भएको हात्ती, बुधबार दिउँसो दाँत नभएको हात्ती, बिहीबार मुसा, शुक्रबार गिनी पिग, शनिबार नाग।`,
      `မြန်မာ- မွေးနှစ်ဖြင့် မဟုတ်ဘဲ မွေးနေ့ (နေ့နံ) ဖြင့် တိရစ္ဆာန်ကို သတ်မှတ်သည် (၈ မျိုး)။ တနင်္ဂနွေ ဂဠုန်၊ တနင်္လာ ကျား၊ အင်္ဂါ ခြင်္သေ့၊ ဗုဒ္ဓဟူး (နံနက်) ဆင်၊ ဗုဒ္ဓဟူး (ညနေ) ဟိုင်း၊ ကြာသပတေး ကြွက်၊ သောကြာ ပူး၊ စနေ နဂါး။`),
    X(`イギリス・アメリカなど {英語|えいご}の {国|くに}：{干支|えと}は ふつう {使|つか}いません。{生|う}まれた {日|ひ}で きまる 12の {星座|せいざ}（おひつじ{座|ざ}・おうし{座|ざ}など）が よく {知|し}られています。`,
      `English-speaking countries such as the UK and the USA: the zodiac animals are not usually used. The 12 star signs decided by your birthday (Aries, Taurus, etc.) are well known.`,
      `英国、美国等英语国家：一般不用生肖，而是常说按生日决定的十二星座（白羊座、金牛座等）。`,
      `Các nước nói tiếng Anh như Anh, Mỹ: thường không dùng con giáp. Người ta hay nói về 12 cung hoàng đạo theo ngày sinh (Bạch Dương, Kim Ngưu, v.v.).`,
      `बेलायत, अमेरिका जस्ता अङ्ग्रेजी बोल्ने देश: राशि जनावर प्रायः प्रयोग हुँदैन। जन्मदिनअनुसार तय हुने १२ राशि (मेष, वृष आदि) धेरै चर्चित छन्।`,
      `ယူကေ၊ အမေရိကန် စသော အင်္ဂလိပ်စကားပြော နိုင်ငံများ- တိရစ္ဆာန်နှစ်ကို အများအားဖြင့် မသုံးပါ။ မွေးနေ့အလိုက် သတ်မှတ်သော ရာသီခွင် ၁၂ ခု (မိဿ၊ ပြိဿ စသည်) ကို လူသိများသည်။`)
  ],
  ask: X(`あなたの {国|くに}では どうですか？ {家族|かぞく}にも きいて、みんなに {教|おし}えて ください。`,
    `What about your country? Ask your family too, and tell the class.`,
    `你的国家是怎样的？也问问家人，然后告诉大家吧。`,
    `Ở nước bạn thì sao? Hãy hỏi cả gia đình rồi kể cho cả lớp nghe.`,
    `तपाईंको देशमा कस्तो छ? परिवारलाई पनि सोधेर कक्षामा सबैलाई सुनाउनुहोस्।`,
    `သင့်နိုင်ငံမှာ ဘယ်လိုလဲ။ မိသားစုကိုလည်း မေးပြီး အတန်းထဲက လူတွေကို ပြောပြပေးပါ။`)
};
// 干支の考え方と「ね・うし・とら」の由来（出典：国立国会図書館「日本の暦」第三章 干支①六十干支／国立天文台 暦Wiki「干支」／小学館HugKum「巳には『ヘビ』の意味はない」2025／中国非物質文化遺産網（ihchina.cn）「日書」と十二生肖／『論衡』（後漢・王充）。vi/ne/myは試訳）
const ETO_ABOUT = {
  t: X("{干支|えと}って なに？「ね・うし・とら」の ゆらい","What is eto? Where do ne, ushi, tora… come from?","什么是“干支”？“ね・うし・とら”的由来","Eto là gì? Nguồn gốc của “ne, ushi, tora…”","एतो भनेको के हो? “ने, उसी, तोरा…” को उत्पत्ति","ဧတိုဆိုတာ ဘာလဲ။ “နဲ၊ ဥရှိ၊ တိုရ…” ၏ မူလ"),
  rows: [
    X(`{十二支|じゅうにし}（{子|ね}・{丑|うし}・{寅|とら}…）は、むかしの {中国|ちゅうごく}で、{年|とし}・{月|つき}・{時|じ}こく・{方角|ほうがく}を じゅんばんに あらわすための 12の {字|じ}でした。この {字|じ}には、もともと {動物|どうぶつ}の いみは ありません。`,
      `The twelve branches (子, 丑, 寅…) were 12 characters used in ancient China to show years, months, times of day and directions in order. These characters did not originally mean animals.`,
      `十二支（子、丑、寅……）是古代中国用来依次表示年、月、时辰和方位的12个字。这些字本来并没有动物的意思。`,
      `Thập nhị chi (Tý, Sửu, Dần…) là 12 chữ mà người Trung Quốc xưa dùng để chỉ năm, tháng, giờ và phương hướng theo thứ tự. Những chữ này vốn không có nghĩa là con vật.`,
      `बाह्र शाखा (子, 丑, 寅…) पुरानो चीनमा वर्ष, महिना, समय र दिशा क्रमैसँग जनाउन प्रयोग गरिने १२ अक्षर थिए। यी अक्षरको सुरुमा जनावरको अर्थ थिएन।`,
      `ဆယ့်နှစ်ကိုင်း (子၊ 丑၊ 寅…) သည် ရှေးတရုတ်ပြည်တွင် နှစ်၊ လ၊ အချိန်နှင့် အရပ်မျက်နှာကို အစဉ်လိုက် ပြရန် သုံးသော စာလုံး ၁၂ လုံး ဖြစ်သည်။ ဤစာလုံးများတွင် မူလက တိရစ္ဆာန် အဓိပ္ပာယ် မပါပါ။`),
    X(`あとから、12の {動物|どうぶつ}が あてはめられました。おぼえやすく するためだと いわれています。2200{年|ねん}ほど まえの {竹|たけ}の ふだにも {動物|どうぶつ}との {組|く}み{合|あ}わせが {書|か}かれていて、{今|いま}と ほぼ おなじ 12の {動物|どうぶつ}は、1{世紀|せいき}の {中国|ちゅうごく}の {本|ほん}『{論衡|ろんこう}』に {出|で}てきます。`,
      `Later, 12 animals were matched to them, said to make them easier to remember. Bamboo slips from about 2,200 years ago already pair them with animals, and a list of 12 animals almost the same as today's appears in the Chinese book Lunheng (1st century).`,
      `后来才配上了12种动物，据说是为了便于记忆。约2200年前的竹简上已经写有地支与动物的搭配，和今天几乎相同的十二种动物见于1世纪的中国典籍《论衡》。`,
      `Về sau, người ta gán 12 con vật vào, được cho là để dễ nhớ. Trên thẻ tre khoảng 2.200 năm trước đã có ghi sự kết hợp với con vật, và 12 con vật gần giống ngày nay xuất hiện trong sách Luận Hành của Trung Quốc (thế kỷ 1).`,
      `पछि सम्झन सजिलो होस् भनेर १२ जनावर जोडिएको भनिन्छ। करिब २,२०० वर्षअघिका बाँसका पातामा पनि जनावरसँगको जोडी लेखिएको छ, र आजकै जस्ता १२ जनावर पहिलो शताब्दीको चिनियाँ ग्रन्थ “लुनहेङ” मा देखिन्छन्।`,
      `နောက်ပိုင်းမှ မှတ်ရလွယ်အောင် တိရစ္ဆာန် ၁၂ ကောင်ကို တွဲခဲ့သည်ဟု ဆိုကြသည်။ လွန်ခဲ့သော နှစ် ၂၂၀၀ ခန့်က ဝါးပြားများတွင်လည်း တိရစ္ဆာန်နှင့် တွဲထားသည်ကို ရေးထားပြီး ယနေ့နှင့် အတော်တူသော တိရစ္ဆာန် ၁၂ ကောင်ကို ပထမရာစု တရုတ်စာအုပ် “လွန်ဟင်း” တွင် တွေ့ရသည်။`),
    X(`{日本|にほん}の「ね・うし・とら・う・たつ・み・うま・ひつじ・さる・とり・いぬ・い」は、あてはめた {動物|どうぶつ}の {日本語|にほんご}の {名前|なまえ}を もとにした {読|よ}み{方|かた}です。ね（ねずみ）・う（うさぎ）・み（へび）・い（いのしし）のように、{動物|どうぶつ}の {名前|なまえ}と すこし ちがう ものも あります。`,
      `In Japan, ne, ushi, tora, u, tatsu, mi, uma, hitsuji, saru, tori, inu, i are readings based on the Japanese names of the matched animals. Some differ a little from the animal's name: ne (nezumi, rat), u (usagi, rabbit), mi (hebi, snake), i (inoshishi, wild boar).`,
      `日本的“ね、うし、とら、う、たつ、み、うま、ひつじ、さる、とり、いぬ、い”，是根据所配动物的日语名称来读的。其中也有和动物名称稍有不同的，如ね（ねずみ，鼠）、う（うさぎ，兔）、み（へび，蛇）、い（いのしし，野猪）。`,
      `Ở Nhật, “ne, ushi, tora, u, tatsu, mi, uma, hitsuji, saru, tori, inu, i” là cách đọc dựa trên tên tiếng Nhật của các con vật được gán. Có cách đọc hơi khác tên con vật, như ne (nezumi: chuột), u (usagi: thỏ), mi (hebi: rắn), i (inoshishi: lợn rừng).`,
      `जापानको “ने, उसी, तोरा, उ, तात्सु, मी, उमा, हित्सुजी, सारु, तोरी, इनु, इ” जोडिएका जनावरहरूको जापानी नाममा आधारित पढाइ हो। केही जनावरको नामभन्दा अलि फरक छन्: ने (नेजुमी, मुसा), उ (उसागी, खरायो), मी (हेबी, सर्प), इ (इनोसिसी, बँदेल)।`,
      `ဂျပန်၏ “နဲ၊ ဥရှိ၊ တိုရ၊ ဥ၊ တဆု၊ မိ၊ ဥမ၊ ဟိဆုဂျိ၊ ဆရု၊ တိုရိ၊ အိနု၊ အိ” သည် တွဲထားသော တိရစ္ဆာန်တို့၏ ဂျပန်အမည်ကို အခြေခံသော အဖတ် ဖြစ်သည်။ နဲ (နဲဇုမိ၊ ကြွက်)၊ ဥ (ဥဆဂိ၊ ယုန်)၊ မိ (ဟဲဘိ၊ မြွေ)၊ အိ (အိနိုရှိရှိ၊ တောဝက်) ကဲ့သို့ တိရစ္ဆာန်အမည်နှင့် အနည်းငယ် ကွာသည်များလည်း ရှိသည်။`),
    X(`「{干支|えと}」は、ほんとうは {十干|じっかん}（{甲|きのえ}・{乙|きのと}…）と {十二支|じゅうにし}を {組|く}み{合|あ}わせた もので、60で ひとまわりします。60さいの お{祝|いわ}い「{還暦|かんれき}」は ここから きています。「えと」と いう ことばは、{十干|じっかん}の「{兄|え}」と「{弟|と}」から きました。{今|いま}は {十二支|じゅうにし}だけを「{干支|えと}」と いうことが {多|おお}いです。`,
      `Strictly, eto is the combination of the ten stems (甲, 乙…) and the twelve branches, which repeats every 60. This is why the 60th birthday is celebrated as kanreki. The word eto comes from e (elder brother) and to (younger brother) in the names of the ten stems. Today people often use eto to mean just the twelve animals.`,
      `“干支”本来是十天干（甲、乙……）和十二地支的组合，60年一轮回。日本60岁的“还历”庆祝就是由此而来。“えと”这个词来自十干的“兄（え）”和“弟（と）”。现在日本人多用“干支（えと）”来指十二生肖。`,
      `“Can chi” vốn là sự kết hợp giữa thập can (Giáp, Ất…) và thập nhị chi, cứ 60 năm lặp lại một vòng. Lễ mừng 60 tuổi “kanreki” ở Nhật bắt nguồn từ đây. Từ “eto” xuất phát từ “e (anh)” và “to (em)” trong cách đọc thập can. Ngày nay người Nhật thường gọi riêng 12 con giáp là “eto”.`,
      `“एतो” वास्तवमा दस “स्टेम” (甲, 乙…) र बाह्र शाखाको संयोजन हो, जुन ६० मा एक फन्को पूरा गर्छ। ६० वर्षको उत्सव “कानरेकी” यहीँबाट आएको हो। “एतो” शब्द दस स्टेमका “ए (दाजु)” र “तो (भाइ)” बाट आएको हो। आजकल प्रायः १२ जनावरलाई मात्र “एतो” भनिन्छ।`,
      `“ဧတို” သည် အမှန်တွင် ဆယ်ပင်စည် (甲၊ 乙…) နှင့် ဆယ့်နှစ်ကိုင်းကို ပေါင်းထားခြင်း ဖြစ်ပြီး ၆၀ တွင် တစ်ပတ်ပြည့်သည်။ အသက် ၆၀ ပွဲ “ကန်ရဲကိ” သည် ဤနေရာမှ လာသည်။ “ဧတို” ဟူသော စကားလုံးသည် ဆယ်ပင်စည်၏ “ဧ (အစ်ကို)” နှင့် “တို (ညီ)” မှ လာသည်။ ယခု တိရစ္ဆာန် ၁၂ ကောင်ကိုသာ “ဧတို” ဟု ခေါ်လေ့ ရှိသည်။`),
    X(`ねずみが うしの せなかに のって 1ばんに なった、と いう {神様|かみさま}の かけっこの {昔話|むかしばなし}も {有名|ゆうめい}ですが、これは あとから できた お{話|はなし}です。また、{干支|えと}を {使|つか}わない {国|くに}や {地域|ちいき}も たくさん あります。{下|した}の「くにによって ちがう {干支|えと}」も {見|み}て ください。`,
      `The folk tale of the gods' race, in which the rat rode on the ox's back and came first, is famous, but it was made up later. Also, many countries and regions do not use the zodiac at all. See "How the zodiac differs by country" below.`,
      `老鼠骑在牛背上抢得第一的“动物赛跑”故事很有名，但那是后来才有的传说。另外，也有很多国家和地区不使用十二生肖。请看下面的“各国生肖的不同”。`,
      `Câu chuyện cuộc đua của các con vật, chuột cưỡi trên lưng trâu mà về nhất, rất nổi tiếng, nhưng đó là chuyện có về sau. Ngoài ra, cũng có nhiều nước và vùng không dùng con giáp. Hãy xem phần “Con giáp khác nhau ở mỗi nước” ở dưới.`,
      `मुसा गोरुको ढाडमा चढेर पहिलो भएको देवताको दौडको लोककथा चर्चित छ, तर त्यो पछि बनेको कथा हो। साथै, राशि जनावर प्रयोग नगर्ने धेरै देश र क्षेत्र पनि छन्। तलको “देशअनुसार फरक राशि जनावर” पनि हेर्नुहोस्।`,
      `ကြွက်က နွားကျောပေါ်စီးပြီး ပထမ ရခဲ့သည်ဟူသော နတ်ဘုရား၏ အပြေးပြိုင်ပွဲ ပုံပြင်သည် နာမည်ကြီးသော်လည်း နောက်မှ ပေါ်လာသော ပုံပြင် ဖြစ်သည်။ ထို့အပြင် တိရစ္ဆာန်နှစ်ကို မသုံးသော နိုင်ငံနှင့် ဒေသများလည်း အများအပြား ရှိသည်။ အောက်ရှိ “နိုင်ငံအလိုက် ကွာခြားသော တိရစ္ဆာန်နှစ်” ကိုလည်း ကြည့်ပါ။`)
  ]
};
let etoAboutOpen = false;
function etoAbout(){
  return `<details class="eto-world" id="etoAbout"${etoAboutOpen?" open":""}><summary>${L(ETO_ABOUT.t)}</summary>
   <ul>${ETO_ABOUT.rows.map(r=>`<li><p>${L(r,{tag:"span",say:true})}</p>${sayBtn(kana(r.ja),"きく")}</li>`).join("")}</ul></details>`;
}
document.addEventListener("toggle", e => { if(e.target.id === "etoAbout") etoAboutOpen = e.target.open; }, true);
let etoWorldOpen = false;
function etoWorld(){
  return `<details class="eto-world" id="etoWorld"${etoWorldOpen?" open":""}><summary>${L(ETO_WORLD.t)}</summary>
   <ul>${ETO_WORLD.rows.map(r=>`<li><p>${L(r,{tag:"span",say:true})}</p>${sayBtn(kana(r.ja),"きく")}</li>`).join("")}</ul>
   <p class="eto-ask">${L(ETO_WORLD.ask,{tag:"span"})}</p></details>`;
}
document.addEventListener("toggle", e => { if(e.target.id === "etoWorld") etoWorldOpen = e.target.open; }, true);
function etoWidget(){
  const Y = cardYear(), cur = etoOf(Y), now = new Date().getFullYear();
  return `<div class="eto-ring" aria-label="十二支">${ETO.map(e=>`<span class="eto ${e===cur?"on":""}"><b>${rb(`{${e.k}|${e.r}}`)}</b><small>${e.a}</small>${etoTr(e)}</span>`).join("")}</div>
  <div class="born"><label for="bornYear">${L(BORN.lab)}</label>
   <div class="born-row"><input type="number" id="bornYear" inputmode="numeric" min="1900" max="${now}" placeholder="${now-30}" autocomplete="off"><div id="bornOut" aria-live="polite"></div></div>
   <p class="hint">${L(BORN.note)}</p><p class="hint">${L(BORN.save)}</p></div>
  ${etoAbout()}
  ${etoWorld()}`;
}
document.addEventListener("input", e => {
  if(e.target.id !== "bornYear") return;
  const y = parseInt(e.target.value, 10), now = new Date().getFullYear(), out = $("#bornOut");
  out.innerHTML = (y >= 1900 && y <= now) ? bornResult(y) : "";
});

/* ---------- card builder (shared by parts/write/print) ---------- */
function gashiFont(g, hasPic, yoko){
  const n = [...plain(g)].length || 1;
  const k = n <= 4 ? 2.1 : 1.55;
  const avail = yoko ? 82 : (hasPic ? 60 : 84);
  const unit = yoko ? "cqw" : "cqh";
  return `font-size:min(calc(var(--fs) * ${k}cqw), calc(${avail}${unit} / ${n + 0.6}))`;
}
function cardHTML(c, mode){
  // c: {gashi, body:[html strings], close, date, name, pic, drawing, dir}; strings already rendered (ruby or plain)
  const yoko = c.dir === "yoko";
  const hasPic = !!c.pic && c.pic !== "none" && !(c.pic==="draw" && !c.drawing);
  const cls = ["hagaki", yoko?"yoko":"", hasPic?"has-pic":"", mode==="trace"?"mode-trace":"", mode==="parts"?"parts-on":""].join(" ");
  const pic = !hasPic ? "" : c.pic==="draw" ? `<img src="${c.drawing}" alt="">` : picSVG(c.pic);
  return `<div class="${cls}"><div class="card-text" style="--fs:5">
    ${c.gashi?`<p class="c-gashi seg s1" style="${gashiFont(c.gashiRaw||c.gashi, hasPic, yoko)}">${c.gashi}</p>`:""}
    ${c.body.length?`<div class="c-body seg s2">${c.body.map(b=>`<p>${b}</p>`).join("")}</div>`:""}
    ${c.close?`<p class="c-close seg s3">${c.close}</p>`:""}
    <div class="c-sign seg s4"><span class="c-date">${c.date||""}</span><span class="c-name">${c.name||""}</span></div>
  </div>${pic?`<div class="c-pic">${pic}</div>`:""}</div>`;
}
function fit(h){
  const t = h.querySelector(".card-text"); if(!t || !t.clientWidth) return;
  let fs = 7.2;
  t.style.setProperty("--fs", fs);
  let guard = 0;
  while((t.scrollWidth > t.clientWidth + 1 || t.scrollHeight > t.clientHeight + 1) && fs > 2.2 && guard++ < 80){
    fs -= .12; t.style.setProperty("--fs", fs.toFixed(2));
  }
  // ぶら下がり（行末の1〜2字だけが次の行に出る）を避けるため、少しだけ文字を小さくして試す
  const base = fs;
  if(orphans(t, h) > 0){
    let best = null;
    for(let f = base - .1; f >= base * .82; f -= .1){ t.style.setProperty("--fs", f.toFixed(2)); if(orphans(t, h) === 0){ best = f; break; } }
    t.style.setProperty("--fs", (best || base).toFixed(2));
  }
}
function orphans(t, h){
  const yoko = h.classList.contains("yoko"); let n = 0;
  t.querySelectorAll(".c-body p, .c-close").forEach(el => {
    const r = document.createRange(); r.selectNodeContents(el);
    const rs = [...r.getClientRects()].filter(x => x.width > 1 && x.height > 1);
    if(rs.length > 1){ const last = rs[rs.length-1], first = rs[0]; if((yoko ? last.width / first.width : last.height / first.height) < .3) n++; }
  });
  return n;
}
// なぞりがき：各行の中心に点線（日本郵便『楽しい年賀状を作ろう！』中・高学年用の練習欄にならう）
function addGuides(h){
  const t = h.querySelector(".card-text"); if(!t) return;
  const old = h.querySelector(".guides"); if(old) old.remove();
  const hr = h.getBoundingClientRect(), tr = t.getBoundingClientRect(), yoko = h.classList.contains("yoko");
  const cs = [];
  t.querySelectorAll("p, .c-date, .c-name").forEach(el => {
    const r = document.createRange(); r.selectNodeContents(el);
    [...r.getClientRects()].forEach(rc => { if(rc.width < 1 || rc.height < 1) return; cs.push(yoko ? (rc.top + rc.bottom)/2 - hr.top : (rc.left + rc.right)/2 - hr.left); });
  });
  cs.sort((a,b)=>a-b);
  const uniq = cs.filter((c,i)=> i===0 || c - cs[i-1] > 2);
  const g = document.createElement("div"); g.className = "guides " + (yoko ? "h" : "v");
  g.innerHTML = uniq.map(c => yoko
    ? `<i style="top:${(c/hr.height*100).toFixed(3)}%;left:${((tr.left-hr.left)/hr.width*100).toFixed(3)}%;width:${(tr.width/hr.width*100).toFixed(3)}%"></i>`
    : `<i style="left:${(c/hr.width*100).toFixed(3)}%;top:${((tr.top-hr.top)/hr.height*100).toFixed(3)}%;height:${(tr.height/hr.height*100).toFixed(3)}%"></i>`).join("");
  h.insertBefore(g, t);
}
function fitAll(){ requestAnimationFrame(()=>document.querySelectorAll("#main .hagaki:not(.addr)").forEach(fit)); }

function find(list, id){ return list.find(x=>x.id===id); }
function cardModel(mode){
  const c = state.card, R = mode==="furi" ? rb : plain;
  const fillIn = (tpl, val) => {
    const v = (val||"").trim();
    const parts = R(tpl).split(BLANK);
    const filled = v ? esc(v) : (mode==="final"||mode==="trace" ? "〇〇" : `<span class="blank">〇〇</span>`);
    return parts.join(mode==="preview" && !v ? `<span class="blank">〇〇</span>` : filled);
  };
  if(c.mode === "easy"){
    const ez = easyState();
    const body = ez.mid.map(n => { const p = find(EASY.mid, n.id); return p ? fillIn(p.ja, n.fill) : ""; }).filter(Boolean);
    const en = find(EASY.end, ez.end);
    return {gashi: EASY.start, gashiRaw: EASY.start, body, close: en ? R(en.ja) : "", date: R(EASY.date), name: esc(c.name||""), pic:c.pic, drawing:c.drawing, dir:c.dir};
  }
  const g = find(GASHI, c.gashi);
  const body = [];
  const th = find(THANKS, c.thanks); if(th) body.push(R(th.ja));
  (c.news||[]).forEach(n => { const p = find(NEWS, n.id); if(p) body.push(fillIn(p.ja, n.fill)); });
  if(c.free && c.free.trim()) c.free.trim().split(/\n+/).forEach(line=>body.push(esc(line)));
  const cl = find(CLOSING, c.closing);
  const d = find(DATES, c.date);
  return {gashi: g?R(g.ja):"", gashiRaw: g?g.ja:"", body, close: cl?R(cl.ja):"", date: d?R(d.ja):"", name: esc(c.name||""), pic:c.pic, drawing:c.drawing, dir:c.dir};
}
function easyState(){
  const c = state.card;
  if(!c.easy) c.easy = {mid:[{id:"e1", fill:"かんじ"}], end: partnerUp() ? "x1" : "x2"};
  return c.easy;
}
function cardSpeech(){
  const c = state.card, out = [];
  if(c.mode === "easy"){
    const ez = easyState();
    out.push(EASY.start);
    ez.mid.forEach(n => { const p = find(EASY.mid, n.id); if(p) out.push(p.ja.replace(BLANK, n.fill || "なになに")); });
    const en = find(EASY.end, ez.end); if(en) out.push(en.ja);
    out.push(kana(EASY.date)); if(c.name) out.push(c.name);
    return out.join("。");
  }
  const g = find(GASHI, c.gashi); if(g) out.push(kana(g.ja));
  const th = find(THANKS, c.thanks); if(th) out.push(kana(th.ja));
  (c.news||[]).forEach(n=>{const p=find(NEWS,n.id); if(p) out.push(kana(p.ja).replace(BLANK, n.fill||"なになに"));});
  if(c.free) out.push(c.free);
  const cl = find(CLOSING, c.closing); if(cl) out.push(kana(cl.ja));
  const d = find(DATES, c.date); if(d) out.push(c.date==="d2" ? `${cardYear()}年 がんたん` : kana(d.ja));
  if(c.name) out.push(c.name);
  return out.join("。");
}

/* drawing pad */
function setupDraw(){
  const cv = $("#drawPad"); if(!cv) return;
  const ctx = cv.getContext("2d");
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  let color = "#1A1A1A", size = 6, drawing = false, last = null;
  const restore = () => { ctx.fillStyle="#fff"; ctx.fillRect(0,0,cv.width,cv.height); if(state.card.drawing){ const im = new Image(); im.onload = () => ctx.drawImage(im,0,0,cv.width,cv.height); im.src = state.card.drawing; } };
  restore();
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX-r.left)*cv.width/r.width, (e.clientY-r.top)*cv.height/r.height]; };
  cv.addEventListener("pointerdown", e => { drawing = true; last = pos(e); cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last[0], last[1], size/2, 0, Math.PI*2); ctx.fillStyle = color; ctx.fill(); });
  cv.addEventListener("pointermove", e => { if(!drawing) return; const p = pos(e); ctx.strokeStyle = color; ctx.lineWidth = size; ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; });
  const end = () => { if(!drawing) return; drawing = false; state.card.drawing = cv.toDataURL("image/png"); touched(); updateCard(); };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end); cv.addEventListener("pointerleave", end);
  document.querySelectorAll(".pen").forEach(b => b.addEventListener("click", () => { color = b.dataset.pen; document.querySelectorAll(".pen").forEach(x=>x.setAttribute("aria-pressed", x===b)); }));
  $("#penSize").addEventListener("click", e => { const s = {"3":["6","中"],"6":["12","太"],"12":["3","細"]}[String(size)]; size = +s[0]; e.target.textContent = "ふとさ："+s[1]; });
  $("#drawClear").addEventListener("click", () => { state.card.drawing = null; restore(); touched(); updateCard(); });
}

const KNUM = "〇一二三四五六七八九";
function numToKanji(s){
  return s.replace(/[0-9０-９]+/g, m => {
    const d = m.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0));
    const n = parseInt(d,10);
    if(d.length<=2 && n<100){
      if(n<10) return KNUM[n];
      const t = Math.floor(n/10), o = n%10;
      return (t>1?KNUM[t]:"") + "十" + (o?KNUM[o]:"");
    }
    return [...d].map(c=>KNUM[+c]).join("");
  }).replace(/[-‐－−―ｰ]/g, "ー");
}
function zipBoxes(zip, small){
  const d = (zip||"").replace(/[^0-9０-９]/g,"").replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0)).slice(0,7).padEnd(7," ");
  const xs = small ? [56,61,66,72.5,77.5,82.5,87.5] : [44,51,58,65.8,72.6,79.4,86.2];
  const w = small ? 4 : 5.7;
  return [...d].map((ch,i)=>`<i style="left:${xs[i]}cqw">${ch.trim()?esc(ch):""}</i>`).join("") + `<b style="left:${xs[2]+w}cqw;width:${xs[3]-xs[2]-w}cqw"></b>`;
}
function addrHTML(mode){
  const a = state.addr, K = a.kanji ? numToKanji : (s=>s);
  const name = (a.toName||"").trim(), name2 = (a.toName2||"").trim(), ke = a.keisho||"";
  // 連名：2人目は下の名前だけを入れ、1人目の名字の分だけ下げて名前の頭をそろえる
  const parts = name.split(/\s+/), sur = parts.length > 1 ? parts[0] : "";
  const cols = [esc(name).replace(/\s+/g,"　")];
  if(name2) cols.push((sur ? "　".repeat([...sur].length + 1) : "") + esc(name2));
  const longest = Math.max(...cols.map(c => [...c.replace(/&[a-z#0-9]+;/g,"x")].length));
  const n = longest + [...ke].length + 1;
  const nameFs = Math.min(name2 ? 8.2 : 9.5, 64*1.48/(n*1.25)); // cqw; height 64cqh ≈ 94.7cqw
  const fromName = esc(a.fromName||"");
  return `<div class="hagaki addr ${a.real&&mode==="print"?"real-mode":""}">
    <div class="a-stamp">${rb("{切手|きって}")}</div>
    ${a.nenga?`<div class="a-nenga">年賀</div>`:""}
    <div class="zipbox zip-to">${zipBoxes(a.toZip,false)}</div>
    <div class="a-to-addr"><div>${esc(K(a.toAddr1||""))}</div>${a.toAddr2?`<div class="l2">${esc(K(a.toAddr2))}</div>`:""}</div>
    <div class="a-to-name" style="font-size:${nameFs.toFixed(2)}cqw">${cols.map(c=>`<div class="nc"><span style="letter-spacing:.25em">${c}</span><span>${esc(ke)}</span></div>`).join("")}</div>
    <div class="a-from"><div class="fa">${esc(K(a.fromAddr1||""))}</div>${a.fromAddr2?`<div class="fa2">${esc(K(a.fromAddr2))}</div>`:""}<div class="fn">${fromName}</div></div>
    <div class="zipbox zip-from">${zipBoxes(a.fromZip,true).replace(/left:(\d+(\.\d+)?)cqw/g,(m,v)=>`left:${(+v-50).toFixed(1)}cqw`)}</div>
  </div>`;
}

function renderVoiceStatus(){
  const t = document.getElementById("voiceTable"); if(!t) return;
  const ok = "speechSynthesis" in window;
  t.innerHTML = `<tr><th>言語</th><th>この端末</th><th>使われる音声</th><th>試す</th></tr>` + ["ja","en","zh","vi","ne","my"].map(l=>{
    const v = ok ? findVoice(l) : null;
    const sample = {ja:"あけましておめでとうございます",en:"Happy New Year",zh:"新年快乐",vi:"Chúc mừng năm mới",ne:"नयाँ वर्षको शुभकामना",my:"နှစ်သစ်မှာ မင်္ဂလာပါ"}[l];
    return `<tr><td>${LNAME[l]}</td><td class="${v?"ok":"no"}">${v?"○ あり":(voices.length?"× なし":"？ 未取得")}</td><td>${v?esc(v.name):"—"}</td><td><button type="button" class="say-mini" data-say="${esc(sample)}" data-sl="${l}" aria-label="${LNAME[l]}">${ICON_SAY}</button></td></tr>`;
  }).join("");
}
document.addEventListener("click", e => { if(e.target.closest("#voiceRefresh")) loadVoices(); });

/* ---------- print ---------- */
function frameOpt(){
  const on = state.printFrame !== false;
  return `<label class="check frame-opt"><input type="checkbox" data-frameopt="1" ${on?"checked":""}><span>${L(W.frame)}</span></label><p class="note frame-note">${L(on ? W.frameOn : W.printNote)}</p>`;
}
document.addEventListener("change", e => {
  if(!e.target.dataset || !e.target.dataset.frameopt) return;
  state.printFrame = e.target.checked; save();
  document.querySelectorAll("[data-frameopt]").forEach(x => { x.checked = e.target.checked; });
  document.querySelectorAll(".frame-note").forEach(n => { n.innerHTML = L(e.target.checked ? W.frameOn : W.printNote); });
});
function doPrint(kind, mode){
  const area = $("#printArea");
  let st = $("#pageStyle"); if(!st){ st = document.createElement("style"); st.id = "pageStyle"; document.head.appendChild(st); }
  const framed = state.printFrame !== false;
  st.textContent = framed ? "@page{size:A4 portrait;margin:0}" : "@page{size:100mm 148mm;margin:0}";
  area.classList.toggle("framed", framed);
  if(kind==="card"){
    area.innerHTML = cardHTML(cardModel(mode), mode);
    fit(area.querySelector(".hagaki"));
    if(mode === "trace") addGuides(area.querySelector(".hagaki"));
  } else {
    area.innerHTML = addrHTML("print");
  }
  if(framed) area.insertAdjacentHTML("beforeend", `<p class="cut-note">はがきの大きさ（100×148mm）　点線にそって切ってください</p>`);
  setTimeout(()=>{ try{ window.print(); }catch(e){} }, 60);
}

/* ---------- global controls ---------- */
function renderAll(){
  document.body.classList.toggle("multi", state.langs.length > 1);
  document.documentElement.lang = "ja";
  renderTabs(); renderLearn(); renderWords(); renderParts(); renderWrite(); renderAddress(); renderQuiz(); renderTeacher(); renderVoiceStatus();
  showTab(state.tab);
}
function renderLangBtns(){
  $("#langBtns").innerHTML = LANGS.map(([v,l]) => v==="ja"
    ? `<button type="button" class="toggle only" data-lang="ja" aria-pressed="${state.langs.length===0}"><span>${l}</span><span class="nat" lang="en">Japanese only</span></button>`
    : `<button type="button" class="toggle" data-lang="${v}" aria-label="${l}（${LNAME[v]}）" aria-pressed="${state.langs.includes(v)}"><span>${l}</span><span class="nat" lang="${v}">${LNAME[v]}</span></button>`).join("")
    + `<button type="button" class="toggle only" data-lang="all" aria-pressed="${state.langs.length===LANG_ORDER.length}"><span>全て選択</span><span class="nat" lang="en">All</span></button>`;
  const sum = state.langs.length===0 ? "日本語だけ" : state.langs.length===LANG_ORDER.length ? "全言語" : state.langs.map(x=>({en:"英",zh:"中",vi:"越",ne:"ネ",my:"ミャ"})[x]).join("・");
  $("#ctlSum").textContent = sum;
}
$("#langBtns").addEventListener("click", e => {
  const b = e.target.closest("[data-lang]"); if(!b) return;
  const v = b.dataset.lang;
  if(v==="ja") state.langs = [];
  else if(v==="all") state.langs = LANG_ORDER.slice();
  else state.langs = state.langs.includes(v) ? state.langs.filter(x=>x!==v) : LANG_ORDER.filter(x=>x===v || state.langs.includes(x));
  save(); renderLangBtns(); renderAll();
});
renderLangBtns();
const topEl = document.querySelector(".top"), ctlT = $("#ctlToggle");
function setCtl(open){ topEl.classList.toggle("open", open); ctlT.setAttribute("aria-expanded", open); }
setCtl(!!state.ctlOpen);
const hideB = $("#hideHead"), showB = $("#showHead");
function setHead(hidden, focus){
  document.body.classList.toggle("head-hidden", hidden); showB.hidden = !hidden;
  if(focus) (hidden ? showB : hideB).focus();
  fitAll(); const pv = $("#cardPreview .hagaki"); if(pv) fit(pv);
}
setHead(!!state.headHidden, false);
hideB.addEventListener("click", () => { state.headHidden = true; save(); setHead(true, true); });
showB.addEventListener("click", () => { state.headHidden = false; save(); setHead(false, true); });
ctlT.addEventListener("click", () => { state.ctlOpen = !topEl.classList.contains("open"); save(); setCtl(state.ctlOpen); });
const furiBtn = $("#furiBtn"), bigBtn = $("#bigBtn");
function applyToggles(){
  document.body.classList.toggle("no-furi", !state.furi); furiBtn.setAttribute("aria-pressed", state.furi);
  document.body.classList.toggle("big", state.big); bigBtn.setAttribute("aria-pressed", state.big);
}
furiBtn.addEventListener("click", () => { state.furi = !state.furi; save(); applyToggles(); });
bigBtn.addEventListener("click", () => { state.big = !state.big; save(); applyToggles(); fitAll(); });
window.addEventListener("resize", () => { clearTimeout(window.__rz); window.__rz = setTimeout(()=>{ fitAll(); const p=$("#cardPreview .hagaki"); if(p) fit(p); }, 150); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ fitAll(); const p=$("#cardPreview .hagaki"); if(p) fit(p); });

applyToggles();
buildYear();
renderAll();
})();
